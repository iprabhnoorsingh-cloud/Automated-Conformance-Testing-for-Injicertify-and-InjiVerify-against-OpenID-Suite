name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # M9: proves the CI gate mechanism end to end using ONLY the deterministic
  # mock provider. No OpenID Conformance Suite or Inji test-rig is contacted.
  conformance-gate:
    runs-on: ubuntu-latest
    needs: backend
    env:
      MCC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      # M10: the API now requires a key. Generate a throwaway one per job
      # (never stored in Git); the backend and ci_gate.py both read it from
      # MCC_API_KEY in the job environment.
      - name: Generate ephemeral API key
        run: |
          KEY=$(openssl rand -hex 32)
          echo "::add-mask::$KEY"
          echo "MCC_API_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -fsS "$MCC_API_URL/health" && exit 0
            sleep 1
          done
          echo "backend did not become ready" >&2
          cat backend.log >&2
          exit 1
      - name: Gate a passing mock run (must pass)
        run: |
          RUN_ID=$(curl -fsS -X POST "$MCC_API_URL/api/test-runs" -H "Authorization: Bearer $MCC_API_KEY" -H 'Content-Type: application/json' -d '{"run_name":"ci gate pass","environment":"development","components":["inji-certify"],"test_suites":[{"provider":"mock","suite_id":"conformance-ok","display_name":"conformance-ok"}],"benchmark":{"minimum_pass_rate":100,"critical_failures_allowed":0}}' | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          python scripts/ci_gate.py --run-id "$RUN_ID"
      - name: Gate a failing mock run (gate must exit 1, proving fail-closed)
        run: |
          RUN_ID=$(curl -fsS -X POST "$MCC_API_URL/api/test-runs" -H "Authorization: Bearer $MCC_API_KEY" -H 'Content-Type: application/json' -d '{"run_name":"ci gate fail","environment":"development","components":["inji-certify"],"test_suites":[{"provider":"mock","suite_id":"conformance-fail","display_name":"conformance-fail"}],"benchmark":{"minimum_pass_rate":100,"critical_failures_allowed":0}}' | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          set +e
          python scripts/ci_gate.py --run-id "$RUN_ID"
          CODE=$?
          if [ "$CODE" -ne 1 ]; then
            echo "expected gate exit code 1 for a failing run, got $CODE" >&2
            exit 1
          fi
      - name: Backend log
        if: always()
        run: cat backend.log
